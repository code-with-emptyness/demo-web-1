version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: store_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=tshirt_store

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: store_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/tshirt_store
      - JWT_SECRET=production_secret_key_change_in_real_deployment
      - CLIENT_URL=http://localhost:80,http://localhost:5173
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: store_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
